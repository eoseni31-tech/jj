<script>
const initial=[{id:'CCP-0248',name:'David Adebayo',initials:'DA',age:48,condition:'Type 2 diabetes',test:'HbA1c investigation',owner:'Dr. Amara Bello',status:'review',time:'6h 20m',issue:'Clinician unavailable',history:[['Result received','Today, 09:40 · Verified by care coordinator'],['Sample collected','Yesterday, 11:10 · Partner laboratory'],['Investigation requested','03 Nov, 14:20 · Dr. Amara Bello']]},{id:'CCP-0312',name:'Grace Okafor',initials:'GO',age:56,condition:'Hypertension',test:'Renal function panel',owner:'Ada Okoro',status:'pending',time:'2 days',issue:'Result not received',history:[['Expected result outstanding','Today · Provider follow-up required']]},{id:'CCP-0196',name:'Samuel Mensah',initials:'SM',age:61,condition:'Type 2 diabetes',test:'Care-plan follow-up',owner:'Ada Okoro',status:'contact',time:'3h 10m',issue:'Patient not reached',review:'Follow-up consultation requested by clinician.',history:[['Contact unsuccessful','Today, 12:50 · No answer'],['Clinical review recorded','Today, 11:30 · Dr. N. Adeyemi']]},{id:'CCP-0405',name:'Amina Yusuf',initials:'AY',age:39,condition:'Hypertension',test:'Lipid profile',owner:'Dr. N. Adeyemi',status:'review',time:'1h 45m',issue:'Awaiting acknowledgement',history:[['Result received','Today, 14:15 · Verified by care coordinator']]},{id:'CCP-0157',name:'Peter Kamau',initials:'PK',age:52,condition:'Type 2 diabetes',test:'HbA1c investigation',owner:'Dr. N. Adeyemi',status:'closed',time:'Completed',issue:'Communication documented',review:'Care plan reviewed by clinician.',history:[['Follow-through completed','Today, 10:30 · Communication documented']]}];
let cases;try{cases=JSON.parse(localStorage.getItem('care-demo-burgundy-v2'))||structuredClone(initial)}catch{cases=structuredClone(initial)}let view='queue',selected=cases[0].id,tab='all',query='',tour=-1;const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const current=()=>cases.find(c=>c.id===selected);const labels={review:'Awaiting review',pending:'Result pending',contact:'Contact outstanding',closed:'Completed'};const badge=c=>`<span class="pill ${c.status==='pending'||c.status==='contact'?'amber':c.status==='review'?'red':''}">${labels[c.status]}</span>`;function save(){localStorage.setItem('care-demo-burgundy-v2',JSON.stringify(cases))}function notify(t){$('#toast').className='toast';$('#toast').textContent=t;setTimeout(()=>{$('#toast').className='';$('#toast').textContent=''},3200)}function event(c,title,detail){c.history.unshift([title,'Just now · '+detail]);save()}function go(v){view=v;render()}function openCase(id){selected=id;view='detail';render()}function nav(){const items=[['queue','▦','Care queue'],['audit','◷','Activity log'],['about','◇','Design rationale']];$('#nav').innerHTML=items.map(([v,i,t])=>`<button onclick="go('${v}')" class="${view===v||view==='detail'&&v==='queue'?'active':''}"><span>${i}</span><span class="navlabel">${t}</span></button>`).join('')}
function foot(){return '<div class="footer"><span>Independent proposal by Emmanuella Oseni · Not an official Zuri product</span><span>Fictional patients · Changes saved in this browser only</span></div>'}function render(){nav();if(view==='queue'||view==='patients')queue();else if(view==='detail')detail();else if(view==='audit')audit();else about();renderTour()}
function queue(){const active=cases.filter(c=>c.status!=='closed').length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow">Continuous care / Coordination workspace</div><h1>${view==='patients'?'Every patient. A connected journey.':'Care continues.<br>Nothing falls between.'}</h1><p class="muted">From result to resolution. Every handoff has an owner.</p></div><button onclick="resetDemo()">↻ Reset demo</button></div><div class="stats">${[[active,'Open care actions','Across this sample queue'],[cases.filter(c=>c.status==='review').length,'Awaiting clinical review','Receipt does not equal review'],[cases.filter(c=>c.status==='contact').length,'Contact outstanding','Follow-through still required'],[cases.filter(c=>c.status==='closed').length,'Completed pathways','Required steps documented']].map(([n,t,h])=>`<div class="stat"><span class="muted">${t}</span><strong>${String(n).padStart(2,'0')}</strong><small>${h}</small></div>`).join('')}</div><div class="queue-layout"><section class="card"><div class="row"><div><h2>Care coordination queue</h2><span class="muted mini">Illustrative workflow states, not clinical urgency.</span></div><span class="pill">${cases.length} sample pathways</span></div><div class="tabs">${[['all','All actions'],['review','Clinical review'],['contact','Follow-through'],['closed','Completed']].map(([v,t])=>`<button class="${tab===v?'active':''}" onclick="tab='${v}';render()">${t}</button>`).join('')}</div><input aria-label="Search patients or actions" placeholder="Search patient, investigation or owner…" value="${esc(query)}" oninput="query=this.value;renderRows()"><div class="tablewrap"><table><thead><tr><th>Patient / Investigation</th><th>Current state</th><th>Owner / Time in state</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p class="mini muted" style="margin:15px 0 0">Open a pathway to inspect ownership, exceptions and the next step.</p></section><section class="rail"><div class="card"><div class="eyebrow">Today's focus</div><h2 style="margin-top:12px">The handoff matters.</h2><p class="muted mini">${cases[0].status==='review'?'David’s result has arrived. Confirm review ownership and the next required action.':cases[0].status==='contact'?'David’s review is documented. Patient communication remains outstanding.':'David’s investigation pathway is complete. Check any linked follow-up task.'}</p><div class="notice"><b>${esc(cases[0].issue)}</b><br>HbA1c investigation · CCP-0248</div><button class="primary" style="width:100%" onclick="openCase('CCP-0248')">Open David’s pathway →</button></div><div class="insight"><div class="eyebrow">Design principle</div><p style="font-size:17px;margin:10px 0">A delivered result is only the beginning of the next handoff.</p><span class="mini muted">Track receipt, review and communication independently.</span></div></section></div>${foot()}`;renderRows()}
function renderRows(){let rows=cases.filter(c=>(tab==='all'||c.status===tab)&&[c.name,c.test,c.owner,c.id].join(' ').toLowerCase().includes(query.toLowerCase()));$('#rows').innerHTML=rows.length?rows.map(c=>`<tr class="clickable" onclick="openCase('${c.id}')"><td><div class="patient"><span class="avatar">${c.initials}</span><div><strong>${c.name}</strong><small>${c.test}</small></div></div></td><td>${badge(c)}<small>${c.issue}</small></td><td>${esc(c.owner)}<small>${c.time}</small></td><td><button aria-label="Open ${c.name}" onclick="event.stopPropagation();openCase('${c.id}')">↗</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No actions match this view.</td></tr>'}
function detail(){let c=current();let stage=c.status==='pending'?0:c.status==='review'?1:c.status==='contact'?2:3;$('#app').innerHTML=`<button class="back" onclick="go('queue')">← Back to care queue</button><div class="row"><div class="patient"><span class="avatar" style="width:52px;height:52px;font-size:17px">${c.initials}</span><div><div class="eyebrow">Patient pathway / ${c.id}</div><h1>${c.name}</h1><span class="muted">${c.age} years · ${c.condition} · Fictional patient</span></div></div>${badge(c)}</div><div class="steps">${['Investigation','Clinical review','Patient communication','Follow-through'].map((t,i)=>`<div class="step ${i<stage?'done':i===stage?'current':''}"><b>${i<stage?'✓':String(i+1).padStart(2,'0')} &nbsp; ${t}</b><small>${i<stage?'Recorded':i===stage?(stage===3?'Completed':'Action required'):'Not yet complete'}</small></div>`).join('')}</div><div class="detail-grid"><section class="card"><div class="row"><div><h2>${esc(c.test)}</h2><span class="muted mini">Linked care action · ${c.id}-LAB</span></div><button onclick="modal('report')">View source report</button></div>${c.status==='pending'?'<div class="notice"><b>Expected result not received.</b><br>Follow up with the provider. A passed date is not evidence of a completed investigation.</div>':c.status==='review'?`<div class="notice"><b>${c.issue}.</b><br>${c.ack?'Review acknowledged. An authorised clinician must record the clinical decision.':'The review remains open until an authorised clinician takes responsibility and documents the next step.'}</div>`:c.status==='contact'?'<div class="notice"><b>Clinical review recorded. Patient handoff outstanding.</b><br>A saved recommendation does not confirm that the patient received it.</div>':'<div class="insight"><b>Required review and communication documented.</b><br>Any linked follow-up action remains separately visible.</div>'}<h3>Next required action</h3><p>${c.status==='pending'?'Obtain a verified provider update or receive and match the result.':c.status==='review'?(c.ack?'Record the clinician’s review and next step.':'Confirm the appropriate clinician and acknowledge ownership.'):c.status==='contact'?'Document the patient contact outcome and preserve outstanding work.':'No outstanding steps on this investigation pathway.'}</p><div class="actions">${c.status==='pending'?'<button class="primary" onclick="modal(\'receive\')">Record verified result receipt</button>':c.status==='review'?`<button class="primary" onclick="${c.ack?"modal('review')":"acknowledge()"}">${c.ack?'Record clinical review':'Acknowledge review'}</button><button onclick="modal('reassign')">Reassign clinician</button>`:c.status==='contact'?'<button class="primary" onclick="modal(\'contact\')">Record patient contact</button>':''}</div>${c.review?`<div class="report"><div class="eyebrow">Clinician-documented next step</div><p>${esc(c.review)}</p><span class="mini muted">Recorded by ${esc(c.reviewer||c.owner)} · Demo entry</span></div>`:''}${c.followup?`<div class="insight"><b>Linked follow-up task · Open</b><p class="mini">${esc(c.followupLabel||'Arrange follow-up consultation')} · Owner: Ada Okoro<br>Timing: confirm with clinical team. This task is not closed with the investigation.</p></div>`:''}<div class="divider"></div><h3>Pathway activity</h3><p class="mini muted">A traceable history of the work and the people responsible.</p>${c.history.map(([t,d])=>`<div class="event"><b>${esc(t)}</b><small>${esc(d)}</small></div>`).join('')}</section><section><div class="card"><div class="eyebrow">Accountable ownership</div><h2 style="margin-top:15px">${esc(c.owner)}</h2><span class="pill ${c.ack?'':'amber'}">${c.status==='closed'?'Pathway documented':c.status==='contact'?'Coordination action open':c.ack?'Ownership acknowledged':'Action outstanding'}</span><div class="divider"></div><h3>Coordination contact</h3><p class="mini muted">Ada Okoro · Care coordinator<br>Handles tracking and contact attempts.<br>Clinical decisions stay with clinicians.</p><h3>Communication preference</h3><p class="mini muted">Phone call · Fictional consent recorded<br>Do not send clinical details through an unapproved channel.</p></div><div class="insight"><b>Closure criteria</b><p class="mini">${c.status!=='pending'?'✓':'○'} Verified result receipt<br>${c.review?'✓':'○'} Clinician review documented<br>${c.status==='closed'?'✓':'○'} Required communication completed<br>${c.followup||c.status==='closed'?'✓':'○'} Further actions linked or disposition documented</p></div><p class="mini muted" style="padding:10px">Role changes in this prototype are simulated. No real messages, clinical alerts or integrations are triggered.</p></section></div>${foot()}`}
function acknowledge(){let c=current();if(c.issue==='Clinician unavailable'){notify('Assign a covering clinician before acknowledging this review.');modal('reassign');return}c.ack=true;c.issue='Review acknowledged';event(c,'Review acknowledged',c.owner+' · Simulated clinician action');render();notify('Ownership acknowledged. Clinical review remains open.')}
function modal(type){let c=current(),title='',body='';if(type==='reassign'){title='Arrange clinical coverage';body=`<p class="muted">Transfer the review with its full history intact.</p><label for="owner">Covering clinician</label><select id="owner"><option>Dr. N. Adeyemi</option><option>Dr. S. Ibrahim</option></select><label for="reason">Reassignment reason</label><select id="reason"><option>Assigned clinician unavailable</option><option>Coverage rotation</option><option>Capacity reassignment</option></select><div class="notice">Assignment does not count as acknowledgement. The covering clinician must accept the review.</div><button class="primary" onclick="reassign()">Assign covering clinician</button>`}else if(type==='review'){title='Record clinical review';body=`<span class="pill">Simulated authorised clinician · ${esc(c.owner)}</span><label for="decision">Documented next step</label><select id="decision"><option>Arrange a follow-up consultation</option><option>Continue existing care plan as documented by clinician</option><option>Request further investigation</option></select><label for="note">Clinical handoff note</label><textarea id="note" placeholder="Record the clinician’s next step for this fictional case…"></textarea><p class="mini muted">This demo does not interpret lab values or suggest treatment.</p><button class="primary" onclick="review()">Save review and open communication task</button>`}else if(type==='contact'){title='Document patient contact';body=`<label for="outcome">Contact outcome</label><select id="outcome" onchange="contactFields()"><option value="failed">Not reached — no answer</option><option value="success">Reached — clinician’s next step communicated</option><option value="declined">Patient declined further contact</option></select><label for="contactnote">Contact note / disposition</label><textarea id="contactnote" placeholder="Record the attempt, agreed next step or disposition…"></textarea><div class="notice" id="contacthint">The pathway will stay open. A repeat-contact task will be recorded for the care coordinator.</div><button class="primary" onclick="contact()">Save contact outcome</button>`}else if(type==='receive'){title='Record verified result receipt';body='<p>Demonstrate a coordinator matching a received report to this patient and investigation.</p><label for="verified"><input type="checkbox" id="verified" style="width:auto"> Patient and investigation match verified</label><button class="primary" onclick="receive()">Record receipt and route to clinician</button>'}else{title='Source report · Synthetic specimen';body=`<div class="report"><div class="eyebrow">Fictional laboratory document</div><h2 style="margin-top:14px">${esc(c.test)}</h2><p>Patient: ${c.name}<br>Reference: ${c.id}-LAB</p><p class="muted">${c.status==='pending'?'Report not yet received.':'Receipt verified by care coordinator. Numerical findings are intentionally omitted from this workflow demonstration.'}</p></div><p class="mini muted">Clinical interpretation belongs to the authorised clinician. This is a specimen view, not a real lab report.</p>`}$('#overlay').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><section class="modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="row"><h2>${title}</h2><button onclick="closeModal()" aria-label="Close dialog">×</button></div>${body}</section></div>`;$('#overlay button').focus()}
function closeModal(){$('#overlay').innerHTML=''}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&$('#overlay .modal')){const f=[...$('#overlay .modal').querySelectorAll('button,input,select,textarea')],a=f[0],z=f.at(-1);if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}});function reassign(){let c=current(),old=c.owner;c.owner=$('#owner').value;c.ack=false;c.issue='Awaiting acknowledgement';event(c,'Review reassigned',old+' → '+c.owner+' · '+$('#reason').value);closeModal();render();notify('Coverage assigned. Review remains open.')}
function review(){if(!$('#note').value.trim()){notify('Add a handoff note before saving.');return}let c=current();c.review=$('#decision').value+'. '+$('#note').value.trim();c.reviewer=c.owner;c.followup=!$('#decision').value.startsWith('Continue');c.followupLabel=$('#decision').value;c.ack=false;c.status='contact';c.issue='Patient communication required';c.owner='Ada Okoro';c.time='Just now';event(c,'Clinical review documented',c.reviewer+' · Communication task opened');closeModal();render();notify('Review saved. Patient communication is still outstanding.')}
function contactFields(){let v=$('#outcome').value;$('#contacthint').textContent=v==='failed'?'The pathway will stay open. A repeat-contact task will be recorded for the care coordinator.':v==='success'?'The investigation pathway can close. Any linked follow-up task remains open.':'The pathway stays open for clinical-team assessment of the disposition; declining contact does not automatically resolve care.'}
function contact(){let c=current(),v=$('#outcome').value,n=$('#contactnote').value.trim();if(!n){notify('Document the contact attempt or disposition.');return}if(v==='success'){c.status='closed';c.time='Completed';c.issue='Communication documented';event(c,'Patient communication documented',n+' · Investigation pathway completed');}else{c.issue=v==='failed'?'Repeat contact required':'Disposition review required';event(c,v==='failed'?'Contact unsuccessful — repeat task open':'Patient declined contact — clinical-team disposition required',n+' · Owner: Ada Okoro')}closeModal();render();notify(v==='success'?'Pathway completed. Linked follow-up remains visible.':'Outcome recorded. Pathway remains open.')}
function receive(){if(!$('#verified').checked){notify('Verify the patient and investigation match first.');return}let c=current();c.status='review';c.owner='Dr. N. Adeyemi';c.issue='Awaiting acknowledgement';c.time='Just now';event(c,'Result receipt verified','Ada Okoro · Review task assigned to '+c.owner);closeModal();render();notify('Result received. Clinical review task opened.')}
function audit(){$('#app').innerHTML=`<div class="eyebrow">Traceable handoffs</div><h1>Activity log</h1><p class="muted">Sample events and actions recorded during this demonstration.</p><section class="card">${cases.map(c=>`<h3>${c.name} · ${c.id}</h3>${c.history.map(([t,d])=>`<div class="event"><b>${esc(t)}</b><small>${esc(d)}</small></div>`).join('')}<div class="divider"></div>`).join('')}</section>${foot()}`}
function about(){$('#app').innerHTML=`<div class="eyebrow">Independent proposal / Emmanuella Oseni</div><h1>Design for the work between visits.</h1><p class="muted">A focused exploration of clinical follow-through for Zuri’s Continuous Care Programme.</p><div class="detail-grid"><section class="card"><h2>The opportunity</h2><p>Zuri publicly describes continuous care, monitoring, reminders and a results-submission touchpoint. This concept asks how every investigation can remain visible through clinical review and patient communication.</p><div class="notice">These are hypotheses for validation. No access to Zuri’s internal workflows, patient data or systems is implied.</div><h3>Three hypotheses to validate</h3><p>1. Requests need a verified outcome across provider handoffs.<br>2. Received results need explicit review ownership and coverage.<br>3. Documented decisions need communication and linked follow-up.</p><h3>What I would validate with the team</h3><p>Current tools and duplicate work; clinician coverage rules; consent and approved contact channels; escalation policies; the definition of completed communication; and handling of urgent results through existing clinical protocols.</p><h3>How to evaluate a pilot</h3><p>Establish a baseline for overdue investigations without verified outcomes, receipt-to-review time, outstanding communications and coordinator effort. Set targets with clinical and operations leads before a live pilot.</p><div class="source mini"><b>Public references</b><p><a href="https://nigeria.zuri.health/continuous-care-programme" target="_blank" rel="noopener">Zuri Continuous Care Programme ↗</a><br><a href="https://nigeria.zuri.health/results-submission" target="_blank" rel="noopener">Zuri results-submission form ↗</a></p>Research accessed 10 November 2026.</div></section><section><div class="card"><h2>Prototype scope</h2><p class="mini muted">Synthetic patient data.<br>Local browser persistence.<br>Simulated role transitions.<br>No real notifications or clinical decisions.<br>No backend or clinical integrations.</p><button class="primary" onclick="go('queue')">Explore care workspace →</button></div><div class="insight"><b>Designed by Emmanuella Oseni</b><p class="mini">Healthcare Workflow Designer<br>Patient journeys · Care coordination · Clinical handoffs</p></div></section></div>${foot()}`}
function renderTour(){}
function resetDemo(){cases=structuredClone(initial);save();tab='all';query='';view='queue';selected=cases[0].id;render();notify('Demo reset to its original sample data.')}
render();
</script></body></html>
